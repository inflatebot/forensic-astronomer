[project]
name = "forensic-astronomer"
version = "0.1.0"
description = "Cross-platform interaction analysis tool for Twitter and Bluesky"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
graphs = [
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
]
sentiment = [
    "transformers>=4.36.0",
    "torch>=2.0.0",
]
all = [
    "forensic-astronomer[graphs,sentiment]",
]

[project.scripts]
forensic-astronomer = "forensic_astronomer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forensic_astronomer"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]
